[project]
name = "evasao-mlops"
version = "1.0.0"
description = "Motor de Risco de Evasão Escolar com MLOps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- Núcleo de Machine Learning (Ajustado para compatibilidade com Evidently) ---
    "pandas>=2.0.0,<2.3.0",
    "numpy>=1.24.0,<2.1.0",
    "scikit-learn>=1.3.0,<1.6.0",
    "imbalanced-learn>=0.11.0,<0.14.0",
    "joblib>=1.3.0",

    # --- Exploração (Notebooks locais) ---
    "ipykernel>=6.20.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "openpyxl>=3.1.0",

    # --- MLOps 1: Rastreamento (MLflow) ---
    "mlflow>=2.10.0",
    "boto3>=1.34.0",
    "psycopg2-binary>=2.9.9",

    # --- MLOps 2: Backend (FastAPI) ---
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",

    # --- MLOps 3: Monitoramento de Drift ---
    "evidently>=0.4.0",
    "prometheus-client>=0.20.0",

    # --- MLOps 4: Frontend (Interface do Usuário) ---
    "streamlit>=1.32.0"
]